<script>
// Make the whole equation cross-reference clickable.
//
// MathJax turns \ref into an <a> around the equation number only. The "Eq."
// that the \Eqref macro prepends sits outside that anchor, so styling the
// reference as a link left "Eq." looking clickable without being clickable.
//
// This moves the link outwards: the inner anchor is unwrapped and a new one is
// placed around the whole inline-maths container, so "Eq. 1.2" is a single
// clickable unit. Wrapping without unwrapping first would nest <a> inside <a>,
// which browsers silently break apart, so the order matters.
//
// Every reference in these documents is the sole content of its own inline
// maths span, so wrapping the container never swallows surrounding formulae.
//
// Driven by a MutationObserver rather than MathJax.startup.promise: the pages
// load MathJax from a CDN with defer, and hooking the promise proved dependent
// on MathJax's version and load timing. Watching the DOM works whenever the
// maths appears, including a second typesetting pass.
(function () {
  // MathJax handles clicks on its links itself, and only acts when the click
  // lands on the node it recognises as the reference. Once "Eq." is inside the
  // link, clicking it therefore did nothing at all. Navigating here, in the
  // capture phase, makes every part of the reference behave the same way.
  function navigate(event) {
    var link = event.currentTarget;
    var href = link.getAttribute("href") || link.getAttribute("data-mjx-href");
    if (!href || href.charAt(0) !== "#") return;
    if (event.button !== 0 || event.metaKey || event.ctrlKey ||
        event.shiftKey || event.altKey) return;  // leave open-in-new-tab alone

    event.preventDefault();
    event.stopPropagation();

    if (window.location.hash === href) {
      // Same target twice: no hashchange would fire, so scroll explicitly.
      var target = document.getElementById(decodeURIComponent(href.slice(1)));
      if (target) target.scrollIntoView({block: "center"});
    } else {
      // Assigning the hash keeps the URL shareable and lets Quarto's own
      // hashchange handler apply its fixed-header scroll offset.
      window.location.hash = href;
    }
  }

  function promote() {
    var containers = document.querySelectorAll("mjx-container");
    for (var i = 0; i < containers.length; i++) {
      var container = containers[i];
      if (!container.querySelector(".MathJax_ref")) continue;

      // MathJax's own anchor is kept and widened in place: the "Eq." text and
      // the thin space before it are moved inside it. Replacing that anchor
      // with a fresh one, or wrapping mjx-container from the outside, both
      // look right but break the link. MathJax carries its own attributes on
      // that element (data-mjx-href in some builds) and navigates such links
      // itself, so an anchor it does not recognise leads nowhere.
      var link = container.querySelector("a[href]");
      if (!link) continue;
      if (link.classList.contains("quarto-eq-ref")) continue;

      while (link.previousSibling) {
        var prev = link.previousSibling;
        link.parentNode.removeChild(prev);
        link.insertBefore(prev, link.firstChild);
      }
      link.classList.add("quarto-eq-ref");
      link.addEventListener("click", navigate, true);
    }
  }

  function start() {
    promote();
    if (!window.MutationObserver) return;
    // promote() is a no-op once everything is wrapped, so reacting to our own
    // mutations settles after one extra pass instead of looping.
    new MutationObserver(promote).observe(document.body, {childList: true, subtree: true});
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", start);
  } else {
    start();
  }
})();
</script>
