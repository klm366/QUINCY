<script>
  window.MathJax = {
    // Everything on a page is typeset when the page opens. Lazy typesetting was
    // tried here and removed: it leaves the preview shown when hovering a
    // cross-reference blank, because content inserted into a page after load never
    // satisfies its visibility test. Splitting a long document is the way to keep a
    // page quick to open, see doc/guide/4-developer-guide/03_quarto_authoring.qmd.
    tex: {
      tags: 'ams',
      packages: {'[+]': ['ams', 'noerrors']},
      tagSide: 'right',
      tagIndent: '0.8em',
      macros: {
        Eqref: ['\\text{Eq.}\\,\\ref{#1}', 1]
      }
    }
  };
</script>
