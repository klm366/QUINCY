project:
  type: website
  render:
    - "*.qmd"
  resources:
    - media/
website:
  title: ICON-Land Guide
  description: Guide to ICON-Land and JSBACH
  cookie-consent:
    type: express
    # Quarto emits this verbatim as the consent banner's link target: it is not
    # resolved against site-url and not rewritten per page depth, and the banner
    # shows on every page, so a bare relative path would break on nested pages.
    # This default suits `quarto preview`, which serves the site at the host root.
    # build-doc.sh renders with `--profile pages`, which overrides it with the
    # published /jsbach/page/ base path. See _quarto-pages.yml.
    policy-url: /privacy.html
  navbar:
    pinned: true
    left:
      - href: index.qmd
        text: Home
      - about.qmd
  sidebar:
    contents: auto

filters:
  - auto-subeqn.lua

number-sections: true
number-depth: 2

#crossref:
#  sec-labels: alpha A
#  subref-labels: roman i

format:
  html:
    theme:
      light:
        - cosmo
        - brand
      dark:
        - slate
        # - brand
    css: resources/styles.css
    toc: true
    include-in-header: mathjax-config.html
    #include-in-header: mathjax_chapnum2.html
    #include-in-header: mathjax0.html
    #include-in-header: mathjax.html
