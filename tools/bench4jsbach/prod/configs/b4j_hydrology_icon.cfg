field_name=hydrology
suffix=nc
frequence=monthly
documentation="""
NAME 
        hydrology_diagnostic

DESCRIPTION
	This configuration defines the diagnostic and the benchmarking for the
	field hydrology. It specifies the plotting of the results and the 
	generation of texts for the report. As most significant for broader 
	user groups the following variables are choosen:
	     1. precipitation total
	     2. evapotranspiration
	     3. river discharge
DETAILS
        For all experiments in a bench4jsbach run:
    1. find variable data files
	     1. precipitation total   : P
	     2. evapotranspiration    : E
	     3. river discharge       : RD

    2. convert E,P from [kg/m²s] to [mm/day]
	      1 E [kg/m²s] ≙ 8.64e+4 E [mm/day]
       convert RD from [mm/s] to [mm/day]
              1 RD [mm/s] ≙ 8.64e+7 RD [mm/day] 

    3. calculate 
       	     - mean yearsum        -> for each candidate: abs plot, additionaly diff map for each reference
	     - zonal mean          -> for each candidate: one plot with all references
	     - global mean         -> for each candidate: abs barplot with E,P,RD, additionaly diff for each reference 
"""

[fetch]
    [[MPIESM1]]
        [[[E_selcode]]]
            longname=evapotranspiration (avg) [kg/m^2s]
	    unit=kg*(m**(-2)*s**(-1)
	    name=evapotranspiration
	    code=44
	    submodel=jsbach
	    stream=land
        [[[P_selcode]]]
	    longname=precipitation received by JSBACH [kg/m^2s]
	    unit=kg*(m**(-2)*s**(-1)
	    name=precip_acc
	    code=83
	    submodel=jsbach
	    stream=land
    [[ICON]]
        [[[E_selcode]]]
            name=hydro_evapotranspiration_box
	    submodel=lnd_ml
	    stream=None
        [[[Prlr_selcode]]]
            name=prlr
	    longname=large-scale precipitation flux (water)
	    unit=kg m-2 s-1
	    submodel=atm_2d_ml
	    stream=None
        [[[Prcr_selcode]]]
            name=prcr
	    longname=convective precipitation flux (water)
	    unit=kg m-2 s-1
	    submodel=atm_2d_ml
	    stream=None
        [[[Prls_selcode]]]
            name=prls
	    longname=large-scale precipitation flux (snow)
	    unit=kg m-2 s-1
	    submodel=atm_2d_ml
	    stream=None
        [[[Prcs_selcode]]]
            name=prcs
	    longname=convective precipitation flux (snow)
	    unit=kg m-2 s-1
	    submodel=atm_2d_ml
	    stream=None
        [[[P_selcode]]]
            name=pr
	    longname=precipitation flux
	    unit=kg m-2 s-1
	    submodel=atm_2d_ml
	    stream=None

[preprocessing]
    output=E_hydrology,E_yearsummean,E_ysfm,P_hydrology,P_yearsummean,P_ysfm,
    [[MPIESM1]]
        exec=b4j_hydrology_icon_prep.py
        input=E_selcode,P_selcode,
    [[ICON]]
        exec=b4j_hydrology_icon_prep.py
        input=E_selcode,P_selcode,
	
[preprocessing_remapped] 
    output=E_ys-zonmean,P_ys-zonmean,
    [[MPIESM1]]
        exec=b4j_hydrology_icon_remapped_prep.py
        input=E_yearsummean,P_yearsummean,
    [[ICON]]
        exec=b4j_hydrology_icon_remapped_prep.py
        input=E_yearsummean,P_yearsummean,
	
[diagnose]
    exec=b4j_hydrology_icon_diagnose.py
    input=E_yearsummean,P_yearsummean,
    [[E_yearsumdiff]]
    [[E_ysd-zonmean]]   
    [[E_ysdfm]]  
    [[P_yearsumdiff]]
    [[P_ysd-zonmean]]   
    [[P_ysdfm]]   
 

[plotting]
    suffix=png
    [[E_map_plot]]
    	nref=single
        exec=b4j_mapplot.py
    	input=E_yearsumdiff,
	varname=evapotranspiration		
    	title_tmpl='$%(funstr)s_{%(stat1str)s_{%(expabr)s}}$%(expl)s'
    	funstr="\Delta E"
        statstr="y\Sigma m"
    	unit='mm/year'
    	colormap=BrBG
    	[[[E_yearsumdiff_plot]]]
    [[E_map_plot_can]]
    	nref=None
        exec=b4j_mapplot.py
    	input=E_yearsummean,
	varname=evapotranspiration		
    	title_tmpl='$%(funstr)s_{%(stat1str)s_{%(expabr)s}}$%(expl)s'
    	funstr="E"
        statstr="y\Sigma m"
    	unit='mm/year'
    	colormap=BrBG
    	[[[E_yearsummean_plot]]]
    [[E_yszm_plot]]
    	nref=combined
    	exec=b4j_combined_zonmean_lineplot.py

	title_tmpl='$%(funstr)s_{%(stat1str)s_{%(expabr)s}},%(funstr)s_{%(stat2str)s_{%(expabr)s}}$%(expl)s'
	legend_tmpl='$%(funstr)s_{%(stat1str)s_{%(expabr)s}},%(funstr)s_{%(stat2str)s_{%(expabr)s}}$%(expl)s'
	
     	input=E_ysd-zonmean,
	varname=evapotranspiration
	unit='mm/year'
	funstr='\Delta E'
        statstr="y\Sigma zm"	
        statstr_tm="y\Sigma gm"
	
    	input_can=E_ys-zonmean
	varname_can=evapotranspiration
	unit_can='mm/year'
	funstr_can="E"
    	[[[E_ysd-zonmean_plot]]]
    [[P_map_plot]]
    	nref=single
        exec=b4j_mapplot.py
    	input=P_yearsumdiff,
	varname=precip_acc		
    	title_tmpl='$%(funstr)s_{%(stat1str)s_{%(expabr)s}}$%(expl)s'
    	funstr="\Delta P"
        statstr="y\Sigma m"
    	unit='mm/year'
    	colormap=BrBG
    	[[[P_yearsumdiff_plot]]]
    [[P_map_plot_can]]
    	nref=None
        exec=b4j_mapplot.py
    	input=P_yearsummean,
	varname=precip_acc		
    	title_tmpl='$%(funstr)s_{%(stat1str)s_{%(expabr)s}}$%(expl)s'
    	funstr="P"
        statstr="y\Sigma m"
    	unit='mm/year'
    	colormap=BrBG
    	[[[P_yearsummean_plot]]]
    [[P_yszm_plot]]
    	nref=combined
    	exec=b4j_combined_zonmean_lineplot.py

	title_tmpl='$%(funstr)s_{%(stat1str)s_{%(expabr)s}},%(funstr)s_{%(stat2str)s_{%(expabr)s}}$%(expl)s'
	legend_tmpl='$%(funstr)s_{%(stat1str)s_{%(expabr)s}},%(funstr)s_{%(stat2str)s_{%(expabr)s}}$%(expl)s'
	
     	input=P_ysd-zonmean,
	varname=precip_acc
	unit='mm/year'
	funstr='\Delta P'
        statstr="y\Sigma zm"	
        statstr_tm="y\Sigma gm"
	
    	input_can=P_ys-zonmean
	varname_can=precip_acc
	unit_can='mm/year'
	funstr_can="P"
    	[[[P_ysd-zonmean_plot]]]



[report]
    title="diagnostic and benchmarks"
    abstract="""	
This chapter deals with the diagnostic and the benchmarking for the
field hydrology. As most significant for a broader 
user group the following variables are choosen:\\

- evapotranspiration\\

We calculate the year sum mean for the variables in [mm/year] for each 
candidate experiment and their periods in focus and show the differences to 
the reference experiments. A histogram of the field means brings the results 
together and complements them with the water storage change. For 
evapotranspiration and precipitation we provide map and zonal mean plots.
"""
    [[E_yearsumdiff]]
        title='Evapotranspiration, year sum mean'
	name=important_name
	type=map
	isbench=False
	benchunit=mm/year
	canplot=E_yearsummean_plot
	ismatrix=True
	isvector=False
	abstract="""
Evapotranspiration is the sum of evaporation and plant transpiration from the 
earth surface to the atmosphere. Here we concentrate on water from the land surface.
"""
	technical_teXed="""
We denote the difference between candidate ($C$) and reference ($R$) experiment's 
evapotranspiration year sum mean as
\begin{eqnarray*}
\Delta E_{\gls{ysm}_{CR}} & = & E_{\gls{ysm}_{C}} - E_{\gls{ysm}_{R}}, \\
\end{eqnarray*}
with
\begin{eqnarray*}
E_{\gls{ysm}_{E}} & := &\gls{yearsummean}( E_{E} ) \textnormal{ in 
[mm/year]}, \\
E_{E} & := & \textnormal{evapotranspiration of experiment } E
\end{eqnarray*}
For each candidate experiment $C$ there is a subsection showing a map plot of the 
variable evapotranspirations' year sum mean ($E_{\gls{ysm}_{C}}$) followed by 
plots of the difference to each reference $R$ in the \b4j run 
($\Delta E_{\gls{ysm}_{CR}}$).
"""
    [[E_ysd-zonmean]] 
	title='Evapotranspiration, year sum mean, zonal and field mean'
	name=ysdzm
	type=metric
	isbench=False
	benchvar=evapotranspiration
	benchunit=mm/year
	ismatrix=False
	isvector=True
	abstract="""
"""
	technical_teXed="""The difference of zonal mean of year sum mean 
between the candidate ($C$) and the reference ($R$) experiment's 
evapotranspiration variable is denoted by 
\begin{eqnarray*}
\Delta E_{\gls{ysm}\gls{zm}_{CR}} & = & E_{\gls{ysm}\gls{zm}_{C}} - E_{\gls{ysm}\gls{zm}_{R}}, \\
\end{eqnarray*}
with
\begin{eqnarray*}
E_{\gls{ysm}\gls{zm}_{E}} & := & \gls{zonmean} ( E_{\gls{ysm}_{E}} ) 
\textnormal{ in [mm/year]}, \\
E_{E} & := & \textnormal{evapotranspiration of experiment } E
\end{eqnarray*}
The difference of the field means is
\begin{eqnarray*}
\Delta E_{\gls{ysm}\gls{fm}_{CR}} & = & E_{\gls{ysm}\gls{fm}_{C}} - E_{\gls{ysm}\gls{fm}_{R}}, \\
\end{eqnarray*}
with
\begin{eqnarray*}
E_{\gls{ysm}\gls{fm}_{E}} & := & \gls{fieldmean} ( E_{\gls{ysm}_{E}} ) 
\textnormal{ in [mm/year]}
\end{eqnarray*}
The subsections for each candidate experiment $C$ show the variable evatranspirations' 
zonal and  field mean of the year mean sum ($E_{\gls{ysm}\gls{zm}_{C}}$ and 
$E_{\gls{ysm}\gls{fm}_{C}}$) and in a second plot the differences 
to each reference experiment $R$ ($\Delta E_{\gls{ysm}\gls{zm}_{CR}}$ and 
$\Delta E_{\gls{ysm}\gls{fm}_{CR}}$).
"""
   [[P_yearsumdiff]]
        title="Precipitation, year sum mean"
	name="important_name_2"
	type=map
	isbench=False
	benchunit=mm/year
	canplot=P_yearsummean_plot
	ismatrix=True
	isvector=False
	abstract="""
Precipitation is the mechanism that brings atmospheric water vapour  
to the earth surface. We concentrate on the land surface.\\"""
	technical_teXed="""
We denote the difference between candidate ($C$) and reference ($R$) experiment's 
precipitation year sum mean as
\begin{eqnarray*}
\Delta P_{\gls{ysm}_{CR}} & = & P_{\gls{ysm}_{C}} - P_{\gls{ysm}_{R}}, \\
\end{eqnarray*}
with
\begin{eqnarray*}
P_{\gls{ysm}_{E}} & := &\gls{yearsummean}( P_{E} ) \textnormal{ in 
[mm/year]} , \\
P_{E} & := & \textnormal{precipitation of experiment } E
\end{eqnarray*}
For each candidate experiment $C$ there is a subsection showing a map plot of the 
variable precipitations' year sum mean ($P_{\gls{ysm}_{C}}$) followed by 
plots of the difference to each reference $R$ in the \b4j run 
($\Delta P_{\gls{ysm}_{CR}}$).
"""
    [[P_ysd-zonmean]] 
	title='Precipitation, year sum mean, zonal and field mean'
	name=ysdzm
	type=metric
	isbench=False
	benchvar=precip_acc
	benchunit=mm/year
	ismatrix=False
	isvector=True
	abstract="""
"""
	technical_teXed="""The difference of zonal mean of year sum mean 
between the candidate ($C$) and the reference ($R$) experiment's 
precipitation variable is denoted by 
\begin{eqnarray*}
\Delta P_{\gls{ysm}\gls{zm}_{CR}} & = & P_{\gls{ysm}\gls{zm}_{C}} - P_{\gls{ysm}\gls{zm}_{R}}, \\
\end{eqnarray*}
with
\begin{eqnarray*}
P_{\gls{ysm}\gls{zm}_{E}} & := & \gls{zonmean} ( P_{\gls{ysm}_{E}} ) 
\textnormal{ in [mm/year]}, \\
P_{E} & := & \textnormal{precipitation of experiment } E
\end{eqnarray*}
The difference of the field means is
\begin{eqnarray*}
\Delta P_{\gls{ysm}\gls{fm}_{CR}} & = & P_{\gls{ysm}\gls{fm}_{C}} - P_{\gls{ysm}\gls{fm}_{R}}, \\
\end{eqnarray*}
with
\begin{eqnarray*}
P_{\gls{ysm}\gls{fm}_{E}} & := & \gls{fieldmean} ( P_{\gls{ysm}_{E}} ) 
\textnormal{ in [mm/year]}
\end{eqnarray*}
The subsections for each candidate experiment $C$ show the variable precipitations' 
zonal and  field mean of the year mean sum ($P_{\gls{ysm}\gls{zm}_{C}}$ and 
$P_{\gls{ysm}\gls{fm}_{C}}$) and in a second plot the differences 
to each reference experiment $R$ ($\Delta P_{\gls{ysm}\gls{zm}_{CR}}$ and 
$\Delta P_{\gls{ysm}\gls{fm}_{CR}}$).
"""