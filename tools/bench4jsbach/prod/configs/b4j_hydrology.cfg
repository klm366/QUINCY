field_name=hydrology
suffix=nc
frequence=monthly
documentation="""
NAME 
        hydrology_diagnostic

DESCRIPTION
	This configuration defines the diagnostic and the benchmarking for the
	field hydrology. It specifies the plotting of the results and the 
	generation of texts for the report. As most significant for broader 
	user groups the following variables are choosen:
	     1. precipitation total
	     2. evapotranspiration
	     3. river discharge
DETAILS
        For all experiments in a bench4jsbach run:
    1. find variable data files
	     1. precipitation total   : P
	     2. evapotranspiration    : E
	     3. river discharge       : RD

    2. convert E,P from [kg/m²s] to [mm/day]
	      1 E [kg/m²s] ≙ 8.64e+4 E [mm/day]
       convert RD from [mm/s] to [mm/day]
              1 RD [mm/s] ≙ 8.64e+7 RD [mm/day] 

    3. calculate 
       	     - mean yearsum        -> for each candidate: abs plot, additionaly diff map for each reference
	     - zonal mean          -> for each candidate: one plot with all references
	     - global mean         -> for each candidate: abs barplot with E,P,RD, additionaly diff for each reference 
"""

[fetch]
    [[P_selcode]]
	longname=precipitation received by JSBACH [kg/m^2s]
	unit=kg*(m**(-2)*s**(-1)
	[[[MPIESM1]]]
	    name=precip_acc
	    code=83
	    submodel=jsbach
	    stream=land
    [[RD_selcode]]
        longname=river discharge [m/s]
	unit=m*s**(-1)
	[[[MPIESM1]]]
	    name=disch
	    code=218
	    submodel=jsbach
	    stream=jsbach
    [[E_selcode]]
        longname=evapotranspiration (avg) [kg/m^2s]
	unit=kg*(m**(-2)*s**(-1)
	[[[MPIESM1]]]
	    name=evapotranspiration
	    code=44
	    submodel=jsbach
	    stream=land

[preprocessing]
    exec=b4j_hydrology_prep.py
    input=RD_selcode,E_selcode,P_selcode,
    [[E_hydrology]]
    [[P_hydrology]]  
    [[RD_hydrology]]
    [[E_yearsummean]]  
    [[P_yearsummean]] 
    [[RD_yearsummean]]
    
[diagnose]
    exec=b4j_hydrology_diagnose.py
    input=E_yearsummean,P_yearsummean,RD_yearsummean,
    [[E_yearsumdiff]]  
    [[P_yearsumdiff]] 
    [[E_ysd-zonmean]]  
    [[P_ysd-zonmean]] 
    [[E_ysdgm]]  
    [[P_ysdgm]] 

[plotting]
    suffix=png
    [[map_plot]]
        exec=b4j_hydrology_ymsd_plot.py
    	input=E_yearsumdiff,P_yearsumdiff,
    	nref=single	
    	plot_title='$ymsd_{C_{%d}R_{%d}}$,   $C_{%d}$: %s, $R_{%d}$: %s',can_no,ref_no,can_no,can_name,ref_no,ref_name,
	[[[E_yearsumdiff_plot]]]
	[[[P_yearsumdiff_plot]]]
    [[map_plot_can]]
        exec=b4j_hydrology_yms_plot.py
    	input=E_yearsummean,P_yearsummean,
    	nref=None	
    	plot_title='$yms_{C_{%d}}$,   $C_{%d}$: %s',can_no,can_no,can_name,
	[[[E_yearsummean_plot]]]
	[[[P_yearsummean_plot]]]
    [[ysdtm_plot]]
    	exec=b4j_hydrology_ysdtm_plot.py
    	input=E_ysd-zonmean,E_ysdgm,P_ysd-zonmean,P_ysdgm,
    	nref=multiple
    	[[[E_ysd-zonmean_plot]]]
    	[[[P_ysd-zonmean_plot]]]

[report]
    title="diagnostic and benchmarks"
    abstract="""Analysis and benchmarking of land surface hydrology"""
    [[E_yearsumdiff]]
        title="Evapotranspiration, difference"
	name=important_name
	type=map
	isbench=False
	benchunit=mm/year
	canplot=E_yearsummean_plot
	ismatrix=True
	isvector=False
	abstract="""An abstract on the section evapotranspiration  provides ...\\\\"""
	technical_teXed="""
Some more technical text on the section evapotranspiration ...\\\\"""
    [[E_ysd-zonmean]] 
	title='Evapotranspiration, zonal difference'
	name=ysdzm
	type=metric
	isbench=False
	benchvar=evapotranspiration
	benchunit=mm/year
	ismatrix=False
	isvector=True
	abstract="""This benchmark provides ...\\\\ """
	technical_teXed="""
We calculate the global ...\\\\
"""
    [[P_yearsumdiff]]
        title="Precipitation, difference"
	name="important_name_2"
	type=map
	isbench=False
	benchunit=mm/year
	canplot=P_yearsummean_plot
	ismatrix=True
	isvector=False
	abstract="""An abstract on the section precipitation  provides ...\\\\"""
	technical_teXed="""
Some more technical text on the section evapotranspiration ...\\\\"""
    [[P_ysd-zonmean]] 
	title='Precipitation, zonal difference'
	name=ysdzm
	type=metric
	isbench=False
	benchvar=precip_acc
	benchunit=mm/year
	ismatrix=False
	isvector=True
	abstract="""This benchmark provides ...\\\\ """
	technical_teXed="""
We calculate the global ...\\\\
"""

