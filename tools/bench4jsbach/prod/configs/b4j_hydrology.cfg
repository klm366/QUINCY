field_name=hydrology
suffix=nc
frequence=monthly
documentation="""
NAME 
        hydrology_diagnostic

DESCRIPTION
	This configuration defines the diagnostic and the benchmarking for the
	field hydrology. It specifies the plotting of the results and the 
	generation of texts for the report. As most significant for broader 
	user groups the following variables are choosen:
	     1. precipitation total
	     2. evapotranspiration
	     3. river discharge
DETAILS
        For all experiments in a bench4jsbach run:
    1. find variable data files
	     1. precipitation total   : P
	     2. evapotranspiration    : E
	     3. river discharge       : RD

    2. convert E,P from [kg/m²s] to [mm/day]
	      1 E [kg/m²s] ≙ 8.64e+4 E [mm/day]
       convert RD from [mm/s] to [mm/day]
              1 RD [mm/s] ≙ 8.64e+7 RD [mm/day] 

    3. calculate 
       	     - mean yearsum        -> for each candidate: abs plot, additionaly diff map for each reference
	     - zonal mean          -> for each candidate: one plot with all references
	     - global mean         -> for each candidate: abs barplot with E,P,RD, additionaly diff for each reference 
"""

[fetch]
    [[P_selcode]]
	longname=precipitation received by JSBACH [kg/m^2s]
	unit=kg*(m**(-2)*s**(-1)
	[[[MPIESM1]]]
	    name=precip_acc
	    code=83
	    submodel=jsbach
	    stream=land
    [[RD_selcode]]
        longname=river discharge [m/s]
	unit=m*s**(-1)
	[[[MPIESM1]]]
	    name=disch
	    code=218
	    submodel=jsbach
	    stream=jsbach
    [[E_selcode]]
        longname=evapotranspiration (avg) [kg/m^2s]
	unit=kg*(m**(-2)*s**(-1)
	[[[MPIESM1]]]
	    name=evapotranspiration
	    code=44
	    submodel=jsbach
	    stream=land

[preprocessing]
    exec=b4j_hydrology_prep.py
    input=RD_selcode,E_selcode,P_selcode,
    [[E_hydrology]]
    [[P_hydrology]]  
    [[RD_hydrology]]
    [[E_yearsummean]]  
    [[P_yearsummean]] 
    [[RD_yearsummean]]
    [[E_ys-zonmean]]
    [[P_ys-zonmean]]
    [[E_ysfm]]  
    [[P_ysfm]] 
    [[RD_ysfm]] 
    [[WSC_ysfm]] 
    [[H_ysfm]] 
    
[diagnose]
    exec=b4j_hydrology_diagnose.py
    input=E_yearsummean,P_yearsummean,RD_yearsummean,
    [[E_yearsumdiff]]
    [[P_yearsumdiff]]  
    [[RD_yearsumdiff]] 
    [[E_ysd-zonmean]]  
    [[P_ysd-zonmean]] 
    [[RD_ysd-zonmean]] 
    [[E_ysdfm]]  
    [[P_ysdfm]] 
    [[RD_ysdfm]] 
    [[WSC_ysdfm]] 
    [[H_ysdfm]] 

[plotting]
    suffix=png
    [[map_plot]]
        exec=b4j_hydrology_ymsd_plot.py
    	input=E_yearsumdiff,P_yearsumdiff,
    	nref=single	
    	plot_title='$\Delta E_{ysm_{C_{%d}R_{%d}}}$,   $C_{%d}$: %s, $R_{%d}$: %s',can_no,ref_no,can_no,can_name,ref_no,ref_name,
	[[[E_yearsumdiff_plot]]]
	[[[P_yearsumdiff_plot]]]
    [[map_plot_can]]
        exec=b4j_hydrology_yms_plot.py
    	input=E_yearsummean,P_yearsummean,
    	nref=None	
    	plot_title='$E_{yms_{C_{%d}}}$,   $C_{%d}$: %s',can_no,can_no,can_name,
	[[[E_yearsummean_plot]]]
	[[[P_yearsummean_plot]]]
    [[yszm_plot]]
    	exec=b4j_hydrology_yszm_plot.py
     	input=E_ysd-zonmean,P_ysd-zonmean,
    	input_can=E_ys-zonmean,P_ys-zonmean,
    	nref=combined
    	plot_title='$yszm_{C_{%d}}$,   $C_{%d}$: %s',can_no,can_no,can_name,
    	[[[E_ysd-zonmean_plot]]]
    	[[[P_ysd-zonmean_plot]]]
    [[hist_plot]]
        exec=b4j_hydrology_hist_plot.py
	input=H_ysdfm,
	input_can=H_ysfm,
    	nref=combined
	[[[H_ysdfm_plot]]]

[report]
    title="diagnostic and benchmarks"
    abstract="""	
This chapter deals with the diagnostic and the benchmarking for the
field hydrology. As most significant for a broader 
user group the following variables are choosen:\\\\

- evapotranspiration\\
- precipitation accumulated\\
- total surface water runoff\\\\

We calculate the year sum mean for the variables in [mm/year] for each 
candidate experiment and their periods in focus and show the differences to 
the reference experiments. A histogram brings the results together and 
complements them with the water storage change. For evapotranspiration 
and precipitation we provide map and zonal plots.
"""
    [[E_yearsumdiff]]
        title='Evapotranspiration, year sum mean, map plot'
	name=important_name
	type=map
	isbench=False
	benchunit=mm/year
	canplot=E_yearsummean_plot
	ismatrix=True
	isvector=False
	abstract="""
Evapotranspiration is the sum of evaporation and plant transpiration from the 
Earth surface to the atmosphere. Here we concentrate on water from the land surface.
"""
	technical_teXed="""
We denote the difference between candidate ($C$) and reference ($R$) experiment's 
evapotranspiration mean year sum as
\begin{eqnarray*}
\Delta E_{ysm_{CR}} & = & E_{ysm_{C}} - E_{ysm_{R}}, \\
\end{eqnarray*}
with
\begin{eqnarray*}
E_{ysm_{E}} & := &\texttt{yearsummean}( E_{E} ), \\
E_{E} & := & \textnormal{evapotranspiration in } [\frac{mm}{year}] 
\textnormal{ of experiment }E
\end{eqnarray*}

and \texttt{yearsummean}($X$) is defined as
\begin{eqnarray*}
  y_{X} & = & n_{y}^{-1}\sum_{i=0}^{n_{d}-1} x_{iX},\\
&& n_{d} \textnormal{ number of days, }\\
&& n_{y} \textnormal{ number of years in period (consisting of whole years)}
\end{eqnarray*}

"""
    [[E_ysd-zonmean]] 
	title='Evapotranspiration, year sum mean, zonal plot'
	name=ysdzm
	type=metric
	isbench=False
	benchvar=evapotranspiration
	benchunit=mm/year
	ismatrix=False
	isvector=True
	abstract="""
"""
	technical_teXed="""The zonal mean of year sum mean is 

\begin{eqnarray*}
yszm_{CR} & = & \texttt{zonmean} ( E_{ysm_{E}} )
\end{eqnarray*}

with $\texttt{yearsummean}(X)$

\begin{eqnarray*}
  y_{X} & = & n_{l}^{-1}\sum_{i=0}^{n_{l}-1} x_{iX},\\
&& n_{l} \textnormal{ number of points on latitude }l
\end{eqnarray*}
"""
    [[P_yearsumdiff]]
        title="Precipitation, difference"
	name="important_name_2"
	type=map
	isbench=False
	benchunit=mm/year
	canplot=P_yearsummean_plot
	ismatrix=True
	isvector=False
	abstract="""
An abstract on the section precipitation  provides ...\\"""
	technical_teXed="""
Some more technical text on the section evapotranspiration ...\\"""
    [[P_ysd-zonmean]] 
	title='Precipitation accumulated, zonal difference'
	name=ysdzm
	type=metric
	isbench=False
	benchvar=precip_acc
	benchunit=mm/year
	ismatrix=False
	isvector=True
	abstract="""
This benchmark provides ...\\\\ """
	technical_teXed="""
We calculate the global ...\\\\
"""
    [[H_ysdfm]] 
    	title='Global and time mean'
    	name=hydrology_ysdfm
    	type=metric
    	isbench=True
    	benchvar=waterstorage_change
    	benchunit=mm/year
    	ismatrix=False
    	isvector=True
    	abstract="""
This benchmark provides a proxy  ...\\"""
        technical_teXed="""
We calculate the global  ...\\"""
