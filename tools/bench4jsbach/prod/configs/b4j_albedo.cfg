field_name=albedo
suffix=nc
frequence=monthly
documentation="""
NAME 
        albedo_diagnostic

DESCRIPTION
        This configuration defines the diagnostic and the benchmarking for the 
	field albedo. It specifies the plotting of the results and the 
	generation of texts for the report. 

DETAILS
        For all experiments in a bench4jsbach run:
    1.  find variable data files:
        - try to find output files for variable albedo                          :  A
        - if not found, calculate albedo from variables rsus and rsds           :  A = U/D
        - if none of the needed output files found                              :  EXIT ON ERROR

    2.  preprocessing, calculate seasonal means for largest common period: 
        - albedo seasonal means                                                 :  A_sm = sm ( A )
        - only for references:  rsds seasonal means                             :  D_sm = sm ( D )


    3.  matrix processing, for all Candidates c and all References r:
        - difference of albedo seasonal means weighted by rsds seasonal means   :  Δ_cr  = ( A_sm_c - A_sm_r ) * D_sm_r 
        - global mean                                                           :  gm_cr = ∑_wx_x ( Δ_cr * land-sea-mask )
        - time mean                                                             :  tm_cr = ∑_wt_x ( gm_cr )
        - global mean deviation                                                 :  gd_cr = ∑_wx_x ( abs ( Δ_cr * land-sea-mask )
        - time mean deviation                                                   :  td_cr = ∑_wt_x ( gd_cr )

    4.  prepare output:
        - store plots for results of calculations in 3.
        - if report is switched on, prepare text blocks
"""

[fetch]
    [[CMIP5]]
        [[[D_selcode]]]
	    name=rsds
	    code=21
        [[[U_selcode]]]
   	    name=rsus
	    code=22

    [[MPIESM1]]
        [[[D_selcode]]]
	    name=swdown_acc
            code=21
	    submodel=jsbach
	    stream=jsbach
        [[[U_selcode]]]
	    name=swdown_reflect_acc
            code=22
	    submodel=jsbach
	    stream=jsbach
	    
    [[ICON]]
        [[[Dvis_selcode]]]
	    name=a2l_swvis_srf_down_box
	    submodel=lnd_ml
	    stream=None
        [[[Dnir_selcode]]]
            name=a2l_swnir_srf_down_box
	    submodel=lnd_ml
	    stream=None
        [[[rsns_selcode]]]
	    name=rad_sw_srf_net_box
	    submodel=lnd_ml
	    stream=None


[preprocessing]	
    output=UD_div,A_seasmean,D_seasmean,
    [[CMIP5]]
	exec=b4j_albedo_prep.py
    	input=D_selcode,U_selcode,
    [[MPIESM1]]
	exec=b4j_albedo_prep.py
    	input=D_selcode,U_selcode,
    [[ICON]]
        exec=b4j_albedo_icon_prep.py
	input=Dvis_selcode,Dnir_selcode,rsns_selcode,

[diagnose]
    exec=b4j_albedo_diagnose.py
    input=A_seasmean,D_seasmean,
    [[albedo_wds]]
    [[albedo_wdsgm]]
    [[albedo_wdsgtm]]
    [[albedo_wdsgd]]
    [[albedo_wdsgtd]]

[plotting]
    suffix=png	
    [[wds_plot]]
	exec=b4j_albedo_wds_plot.py
    	input=albedo_wds,
	nref=single
    	[[[albedo_wds_plot]]]
	    plot_title='$\Delta A_{C_{%d}R_{%d}}$,   $C_{%d}$: %s, $R_{%d}$: %s',can_no,ref_no,can_no,can_name,ref_no,ref_name,
    [[map_plot_can]]
        exec=b4j_albedo_sms_plot.py
    	input=A_seasmean,
    	nref=None	
	[[[A_seasmean_plot]]]
	    plot_title='$A_{sm_{C_{%d}}}$,   $C_{%d}$: %s',can_no,can_no,can_name,
    [[wdsgtm_plot]]
    	exec=b4j_albedo_wdsgtm_plot.py
    	input=albedo_wdsgm,albedo_wdsgtm,
    	nref=multiple
    	[[[albedo_wdsgtm_plot]]]
    [[wdsgtd_plot]]
    	exec=b4j_albedo_wdsgtd_plot.py
    	input=albedo_wdsgd,albedo_wdsgtd,
    	nref=multiple
    	[[[albedo_wdsgtd_plot]]]

[report]
    title="diagnostic and benchmarks"
    abstract="""The analysis and the benchmarking of the land surface albedo aims at elaborating the climate relevance of the albedos differences between the candidate experiment and the reference dataset. Therefore, signals in net surface solar radiation that result from differences in land surface albedo (instead of signals in surface albedo itself) are shown."""
    [[albedo_wds]]
	# title="Seasonal mean difference"
	# name=delta
 	# type=map
	# isbench=False
	# ismatrix=True
	# isvector=False
        title='Albedo, seasonal mean'
	name=important_name
	type=map
	isbench=False
	benchunit='$\\frac{W}{m^2}$' #'Wm**(-2)'
	canplot=A_seasmean_plot
	ismatrix=True
	isvector=False
	abstract="""The four figures provide an overview of seasonal changes as well as regional changes. The displayed signals in time averaged net surface solar radiation [Wm-2] can be compared with other forcings that impact the local climate via the surface energy balance (e.g. changes in surface heat fluxes or changes in surface thermal radiation). A local absolute signal of $y<$ 3Wm-2 is small and an absolute signal of $>$ 10Wm-2 is probably changing the local climate significantly."""

	technical_teXed="""
The difference between candidate and reference experiments albedo seasonal means 
is weighted with the reference  experiments downwelling radiation seasonal means:
\begin{eqnarray*}
\Delta_{CR} & = & ( A_{sm\_C} - A_{sm\_R}) * D_{sm\_R}, \\
        && A_{sm} = \texttt{yseasmean}( A ), \\
        && D_{sm} = \texttt{yseasmean} ( D ),
\end{eqnarray*}
with
\begin{eqnarray*}
\Delta & := & \textnormal{ weighted difference of albedo in } \frac{W}{m^{2}} \\
A & := & \textnormal{albedo, quotient of upwelling, downwelling radiation in } \% \\
D & := & \textnormal{downwelling solar radiation in } \frac{W}{m^{2}}
\end{eqnarray*}

and \texttt{yseasmean}($X$) defined as
\begin{eqnarray*}
  y_{SX} & = & n_{S}^{-1}\sum_{i=0}^{n_{S}} x_{iX}, \\
        && t\mapsto i, t \in S,  \\
   && S \in \{\textnormal{DJF, MAM, JJA, SON} \}.
\end{eqnarray*}

"""
    [[albedo_wdsgtm]]
	title='Global and time mean'
	name=delta_gtm
	type=metric
	isbench=True
	benchvar=delta
	benchunit=Wm-2
	ismatrix=False
	isvector=True
	abstract="""This benchmark provides a proxy for the globally averaged signal in net surface solar radiation [wm-2] caused by changes in land surface albedo. It gives an indication, if the differences in albedo may change the global temperature level. It can be compared with other global radiative forcings, but it should be kept in mind, that a radiative forcing at the surface shifts the global temperature less efficient than a radiative forcing diagnosed at the tropopause. An absolute value of $<$ 0.3 Wm-2 indicates only a small influence on the global climate, whereas at an absolute value of $>$ 1 Wm-2 the global temperature probably changes significantly. A positive (negative) value hints to a warming (cooling)."""
	technical_teXed="""
We calculate the global and time means of the difference of albedo seasonal means 
weighted by downwelling radiation seasonal means from the last section. The global 
means is 
\begin{eqnarray*}
gm_{CR} & = & \texttt{fldmean} ( \Delta_{CR} * \texttt{land-sea-mask} )
\end{eqnarray*}
with
\begin{eqnarray*}
gm & := & \textnormal{ global mean of weighted difference of albedo  in } \frac{W}{m^{2}}
\end{eqnarray*}
and \texttt{fldmean}($X$) defined as
\begin{eqnarray*}
  y_{t} & = & \sum_{i=0}^{n_{X}} w_{Xi} x_{ti} \\
\end{eqnarray*}
The time mean is then calculated with
\begin{eqnarray*}
tm_{CR} & = & \texttt{timemean} ( gm_{CR} )
\end{eqnarray*}
\begin{eqnarray*}
tm & := & \textnormal{ time and global mean of weighted difference of seasonal mean of albedo  in } \frac{W}{m^{2}}
\end{eqnarray*}
and \texttt{timemean}($X$) defined as
\begin{eqnarray*}
  y & = &  n^{-1} \sum_{i=0}^{n_{T}} x_{i} \\
\end{eqnarray*}
"""
    [[albedo_wdsgtd]]
	title='Global and time deviation'
	name=delta_gtd
	type=metric
	isbench=True
	benchvar=delta
	benchunit=Wm-2
	ismatrix=False
	isvector=True
	abstract="""This benchmark provides a summary of the influence of land surface albedo signals on the regional climate.
A value of $<$ 0.5 Wm$^{-2}$ suggests only little extent of regional climate signals, whereas a value of $>$ 2 Wm$^{-2}$ indicates widespread and substantial regional climate changes in the particular season."""
        technical_teXed="""We calculate the global and time mean deviation of the difference of albedo seasonal mean 
weighted by downwelling radiation seasonal mean from the last section. The global mean deviation is 

\begin{eqnarray*}
gd_{CR} & = & \texttt{fldmean} ( \sqrt{(\Delta_{CR} * \texttt{land-sea-mask})^{2}} )
\end{eqnarray*}

with

\begin{eqnarray*}
gd & := & \textnormal{ global mean deviation of weighted difference of albedo  in } \frac{W}{m^{2}}
\end{eqnarray*}

and \texttt{fldmean}($X$) defined as

\begin{eqnarray*}
  y_{t} & = & \sum_{i=0}^{n_{X}} w_{Xi} x_{ti} \\
\end{eqnarray*}

The time mean is then calculated with

\begin{eqnarray*}
td_{CR} & = & \texttt{timemean} ( gd_{CR} )
\end{eqnarray*}

\begin{eqnarray*}
td & := & \textnormal{time and global mean deviation of weighted difference} \\
 & & \textnormal{seasonal mean of albedo  in } \frac{W}{m^{2}}
\end{eqnarray*}

and \texttt{timemean}($X$) defined as

\begin{eqnarray*}
  y & = &  n^{-1} \sum_{i=0}^{n_{T}} x_{i} \\
\end{eqnarray*}

"""