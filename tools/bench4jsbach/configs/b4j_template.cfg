###############################################################
#
# configuration file for bench4jsbach object '%(<BENCH_NAME>)s'
#
# automatically generated on %(<TODAY>)s
#
###############################################################

### stamp like meta data, do not edit

bench_name=%(<BENCH_NAME>)s		
author=%(<AUTHOR_NAME>)s
git_repository=%(<GIT_ORIGIN>)s
git_branch=%(<GIT_BRANCH>)s
git_sha=%(<GIT_SHA>)s
git_status=%(<GIT_STATUS>)s
redmine_url=https://code.mpimet.mpg.de
redmine_project=jsbach-bench
redmine_wikipage=Bench4jsbach_simulations
host_name=%(<HOSTNAME>)s
host_ipaddress=%(<IP_ADDRESS>)s
b4j_base=%(<B4J_BASE>)s
timestamp=%(<TIMESTAMP>)s

###############################################################
#
# PLEASE EDIT FROM HERE ON DOWNWARD
#
###############################################################

### global meta data

redmine_user=<REDMINE_USER>
redmine_key=<REDMINE_KEY>
institute="Max-Planck-Institute for Meteorology"
department="Land Department"
reporting=<BENCH_IS_REPORTING>

### experiments in diagnostic run, candidates and references

[experiments]
    [[<MODEL_1_ID>]]
        name_orig=<MODEL_1_NAME_ORIGINAL>
	type=<MODEL_1_TYPE>
	path=<MODEL_1_PATH>
	host=<MODEL_1_HOST>
	iscan=<MODEL_1_IS_CANDIDATE>
	isref=<MODEL_1_IS_REFERENCE>
        startyear=<MODEL_1_STARTYEAR_FOR_THIS_RUN>	
        endyear=<MODEL_1_ENDYEAR_FOR_THIS_RUN>
        intitalyear=<MODEL_1_INITIALYEAR_OVERALL>
        finalyear=<MODEL_1_FINALYEAR_OVERALL>
    [[<MODEL_2_ID>]]
        name_orig=<MODEL_2_NAME>
	type=<MODEL_2_TYPE>
	path=<MODEL_2_PATH>
	host=<MODEL_2_HOST>
	iscan=<MODEL_2_IS_CANDIDATE>
	isref=<MODEL_2_IS_REFERENCE>
        startyear=<MODEL_2_STARTYEAR_FOR_THIS_RUN>	
        endyear=<MODEL_2_ENDYEAR_FOR_THIS_RUN>
        intitalyear=<MODEL_2_INITIALYEAR_OVERALL>
        finalyear=<MODEL_2_FINALYEAR_OVERALL>

### diagnostic fields

[fields]
    [[<FIELD_1_NAME>]]
        config_filename=<FIELD_1_CONFIGURATION_FILENAME>

