before_script:
  - apk add --update --no-cache graphviz ttf-freefont

test-job:
  script:
  - sh ./build-doc.sh -q
  tags:
    - sphinx
  rules:
    - if: $CI_COMMIT_REF_NAME != $CI_DEFAULT_BRANCH
      when: manual

pages:
  script:
  - sh ./build-doc.sh -q
  - mv doc/html/ public/
  tags:
    - sphinx
  artifacts:
    paths:
      - public
    expire_in: 10min
  rules:
    - if: ($CI_COMMIT_REF_NAME == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE == "schedule")

