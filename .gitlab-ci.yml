before_script:
  - pip install --no-cache-dir ford

pages:
  script:
  - find /usr -name 'python'
  - echo $PATH
  - echo $PYTHON_PATH
  - sh ./build-doc.sh
  - mv doc/html/ public/
  tags:
    - sphinx
  only:
    - develop-staging
  when: manual
  artifacts:
    paths:
      - public
    expire_in: 5min

