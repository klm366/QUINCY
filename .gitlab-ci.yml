before_script:
  #- pip install --no-cache-dir lxml
  #- pip install --no-cache-dir ford
  - apk add --update --no-cache graphviz ttf-freefont

test:
  script:
  - sh ./build-doc.sh -q
  tags:
    - sphinx
  only:
    when: manual
  rules:
    - if: $CI_COMMIT_REF_NAME != $CI_DEFAULT_BRANCH

pages:
  script:
  - sh ./build-doc.sh -q
  - mv doc/html/ public/
  tags:
    - sphinx
  only:
    - schedules
      #- develop-staging
    #when: manual
    #except:
      #- schedules
  artifacts:
    paths:
      - public
    expire_in: 10min
  rules:
    - if: $CI_COMMIT_REF_NAME == $CI_DEFAULT_BRANCH

