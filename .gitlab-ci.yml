before_script:
  - pip install --no-cache-dir ford

pages:
  script:
  - ls -l /usr/share/gcc-10.2.1/python
  - 'export PATH="/usr/share/gcc-10.2.1:$PATH"'
  - echo PATH
  - sh ./build-doc.sh
  - mv doc/html/ public/
  tags:
    - sphinx
  only:
    - develop-staging
  when: manual
  artifacts:
    paths:
      - public
    expire_in: 5min

