before_script:
  - pip install --no-cache-dir ford

pages:
  script:
  - which pip
  - ls -l /usr/bin/py* /usr/local/bin/py*
  - 'export PATH="/usr/share/gcc-10.2.1:$PATH"'
  - echo $PATH
  - sh ./build-doc.sh
  - mv doc/html/ public/
  tags:
    - sphinx
  only:
    - develop-staging
  when: manual
  artifacts:
    paths:
      - public
    expire_in: 5min

